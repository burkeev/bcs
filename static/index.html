<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЮрКонсультант ИИ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f4f7f6; color: #333; }

        /* Стили окна логина */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 300px; text-align: center; }
        .login-box h2 { margin-top: 0; color: #2c3e50; }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .login-box button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 15px; }

        #sidebar { width: 300px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
        .new-chat-btn { background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 0.95rem; }
        .new-chat-btn:hover { background: #27ae60; }
        .history-item { padding: 10px; border-bottom: 1px solid #34495e; cursor: pointer; transition: background 0.2s; }
        .history-item:hover { background: #34495e; }
        .history-item.active { background: #34495e; }
        .sidebar-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #34495e; }
        .admin-link { display: block; text-align: center; padding: 10px; background: #e67e22; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        .admin-link:hover { background: #d35400; }
        .logout-btn { display: block; width: 100%; padding: 8px; background: transparent; color: #bdc3c7; border: 1px solid #34495e; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .logout-btn:hover { background: #34495e; color: white; }

        #main { flex: 1; display: flex; flex-direction: column; }
        #header { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; }

        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; position: relative; }
        .msg-user { align-self: flex-end; background: #3498db; color: white; border-bottom-right-radius: 0; }
        .msg-bot { align-self: flex-start; background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 0; }
        .references { font-size: 0.8rem; color: #27ae60; margin-top: 5px; font-weight: bold; }
        .feedback-btns { margin-top: 8px; display: flex; gap: 10px; }
        .f-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 2px 8px; font-size: 0.9rem; }

        #input-area { padding: 20px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; }
        #send-btn { padding: 12px 24px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Вход в систему</h2>
            <p style="font-size: 0.9rem; color: #7f8c8d;">Если аккаунта нет, он будет создан автоматически</p>
            <input type="email" id="email-input" placeholder="Ваш Email" required>
            <input type="password" id="pass-input" placeholder="Пароль" required>
            <button onclick="login()">Войти</button>
            <div id="login-error" style="color: #e74c3c; margin-top: 10px; font-size: 0.9rem;"></div>
        </div>
    </div>

    <div id="sidebar">
        <h2>История консультаций</h2>
        <button class="new-chat-btn" onclick="startNewChat()">+ Новый чат</button>
        <div id="history-list" style="flex: 1; overflow-y: auto;"></div>

        <div class="sidebar-footer">
            <a href="/admin" id="admin-link" class="admin-link" style="display: none;">⚙️ Админ-панель</a>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div id="main">
        <div id="header">
            <span>⚖️ Юридический консультант ИИ</span>
            <span id="user-display" style="font-size: 0.9rem; font-weight: normal; color: #7f8c8d;"></span>
        </div>
        <div id="chat-box">
            <div class="message msg-bot">Здравствуйте! Я ваш юридический ИИ-ассистент. Опишите вашу ситуацию (например, "соседи залили квартиру").</div>
        </div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Введите ваш вопрос..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // ================================================
        // Состояние
        // ================================================
        let currentUserId = localStorage.getItem('user_id');
        let currentUsername = localStorage.getItem('username');
        let currentRole = localStorage.getItem('role');
        let currentConversationId = null;

        // ================================================
        // Инициализация
        // ================================================
        window.onload = () => {
            if (currentUserId) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('user-display').innerText = `Пользователь: ${currentUsername}`;
                if (currentRole === 'admin') {
                    document.getElementById('admin-link').style.display = 'block';
                }
                loadHistory();
            }
        };

        // ================================================
        // Аутентификация
        // ================================================
        async function login() {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('pass-input').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (!email || !password) {
                errorDiv.innerText = "Введите email и пароль";
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUserId = data.user_id;
                    currentUsername = data.username;
                    currentRole = data.role;
                    localStorage.setItem('user_id', currentUserId);
                    localStorage.setItem('username', currentUsername);
                    localStorage.setItem('role', currentRole);

                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('user-display').innerText = `Пользователь: ${currentUsername}`;
                    if (currentRole === 'admin') {
                        document.getElementById('admin-link').style.display = 'block';
                    }
                    loadHistory();
                } else {
                    const err = await response.json();
                    errorDiv.innerText = err.detail || "Ошибка авторизации";
                }
            } catch (e) {
                errorDiv.innerText = "Сервер недоступен";
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // ================================================
        // История диалогов
        // ================================================
        async function loadHistory() {
            try {
                const res = await fetch(`/api/history/${currentUserId}`);
                const history = await res.json();
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    if (item.conversation_id === currentConversationId) {
                        div.classList.add('active');
                    }
                    div.onclick = () => loadConversation(item.conversation_id);
                    div.innerHTML = `${item.title || '(без названия)'}<br><small>${new Date(item.last_updated).toLocaleDateString()}</small>`;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("Ошибка загрузки истории", e);
            }
        }

        async function loadConversation(conversationId) {
            try {
                const res = await fetch(`/api/conversations/${conversationId}/messages`);
                if (!res.ok) throw new Error('Ошибка загрузки');
                const messages = await res.json();

                currentConversationId = conversationId;
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';

                messages.forEach(msg => {
                    if (msg.sender === 'user') {
                        chatBox.innerHTML += `<div class="message msg-user">${escapeHtml(msg.text)}</div>`;
                    } else {
                        let botHtml = `<div class="message msg-bot">${escapeHtml(msg.text).replace(/\n/g, '<br>')}`;
                        if (msg.has_legal_references) {
                            botHtml += `<div class="references">✓ Ответ основан на нормативно-правовых актах</div>`;
                        }
                        botHtml += `
                            <div class="feedback-btns">
                                <button class="f-btn" onclick="sendFeedback(${msg.message_id}, true, this)">👍 Полезно</button>
                                <button class="f-btn" onclick="sendFeedback(${msg.message_id}, false, this)">👎 Не полезно</button>
                            </div></div>`;
                        chatBox.innerHTML += botHtml;
                    }
                });

                chatBox.scrollTop = chatBox.scrollHeight;
                loadHistory();  // обновить активный пункт
            } catch (e) {
                console.error("Не удалось загрузить диалог", e);
            }
        }

        function startNewChat() {
            currentConversationId = null;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = `<div class="message msg-bot">Здравствуйте! Я ваш юридический ИИ-ассистент. Опишите вашу ситуацию.</div>`;
            loadHistory();
        }

        // ================================================
        // Чат
        // ================================================
        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentUserId) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message msg-user">${escapeHtml(text)}</div>`;
            input.value = '';

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message msg-bot loading" style="font-style: italic; color: #7f8c8d;">Изучаю законы и готовлю ответ... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(currentUserId),
                        conversation_id: currentConversationId,
                        text
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();
                currentConversationId = data.conversation_id;

                let botHtml = `<div class="message msg-bot">${escapeHtml(data.reply).replace(/\n/g, '<br>')}`;
                if (data.has_references) {
                    botHtml += `<div class="references">✓ Ответ основан на нормативно-правовых актах</div>`;
                }
                botHtml += `
                    <div class="feedback-btns">
                        <button class="f-btn" onclick="sendFeedback(${data.message_id}, true, this)">👍 Полезно</button>
                        <button class="f-btn" onclick="sendFeedback(${data.message_id}, false, this)">👎 Не полезно</button>
                    </div></div>`;

                chatBox.innerHTML += botHtml;
                chatBox.scrollTop = chatBox.scrollHeight;
                loadHistory();
            } catch (error) {
                document.getElementById(loadingId).innerText = '❌ Ошибка соединения с сервером.';
            }
        }

        async function sendFeedback(msgId, isPositive, btn) {
            await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message_id: msgId, is_positive: isPositive })
            });
            const parent = btn.parentElement;
            parent.innerHTML = `<span style="color: #27ae60; font-size: 0.9rem;">Спасибо за оценку!</span>`;
        }

        // ================================================
        // Утилиты
        // ================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
